<!doctype html>
<html>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #111; line-height: 1.4;">
    <div style="margin-bottom: 12px;">
      {logo_html}
    </div>

    <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">
      キャッシュバック受領書および引き換えチケット
    </div>

    <div style="margin-bottom: 12px;">
      <div><b>取引ID:</b> {transaction_id}</div>
      <div><b>日時:</b> {time}</div>
      <div><b>金額:</b> {amount} {currency}</div>
    </div>

    <div style="margin-bottom: 12px;">
      <div><b>ご利用手順:</b></div>
      <ol style="margin-top: 6px;">
        <li>ATM の設置場所へお越しください - {address}</li>
        <li>ATM で <b>REDEEM TICKET</b> を選択してください</li>
        <li>本チケットの QR コードをスキャンしてください</li>
      </ol>
    </div>

    <div style="margin-bottom: 14px; color: #b00020;">
      <b>この引き換えチケットを紛失しないでください!!</b><br />
      <b>現金のお引き出しには本チケットが必要です!!</b>
    </div>
  </body>
</html>
