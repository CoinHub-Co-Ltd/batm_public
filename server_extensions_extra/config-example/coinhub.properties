
# Withdrawal rail: hotwallet | mexc
btc_withdrawal_source=hotwallet

withdrawal_fee_jpy=700

# JPY per 1 USD until OpenExchange is enabled on operation
jpy_usd_rate=160

# Markup components (percent)
coinhub_fee_percent=10
fx_spread_jpy_usd_percent=0.80
cas_buffer_percent=0.07

use_live_fees_api=true

# Operation API
api_key=your_api_key
api_endpoint=https://your-operation-server/v2/api

# CAS Admin REST — reachable from the CAS host (see: ./batm-manage info → admin IP).
# GET/login use HttpURLConnection; PATCH uses Apache HttpClient with SSL hostname bypass for IP URLs.
cas_admin_api_url=https://10.3.2.2:7777
cas_admin_username=
cas_admin_password=
# CAS Admin 2FA — base32 secret from authenticator setup (auto-generates 6-digit codes).
cas_admin_totp_secret=
# Optional static 6-digit code (expires every 30s; use cas_admin_totp_secret instead).
# cas_admin_totp=
cas_admin_login_path=api/v1/auth
#
# When CAS Admin cannot resolve a terminal by serial search, map serial -> admin signature:
# cas_admin_terminal_signature_BT401469=082a785297ebab48fd62832a6b93ca39
# cas_admin_terminal_signatures=BT401469=082a785297ebab48fd62832a6b93ca39,BT300123=...
